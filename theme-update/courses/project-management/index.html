let current=+(localStorage.pmDay||1);let mode=localStorage.pmLang||'both';let done=JSON.parse(localStorage.pmDone||'{}');
const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderNav(){let el=$('#days');el.innerHTML='';COURSE.forEach(d=>{let b=document.createElement('button');b.className='daybtn'+(d.day===current?' active':'');b.textContent=(done[d.day]?'✓ ':'')+'Day '+String(d.day).padStart(2,'0')+' · '+d.vi;b.onclick=()=>{current=d.day;localStorage.pmDay=current;render()};el.appendChild(b)});let n=Object.values(done).filter(Boolean).length;$('#progressBar').style.width=(n/28*100)+'%';$('#progressText').textContent=n+'/28 completed'}
function render(){document.body.className='mode-'+mode;document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));renderNav();let d=COURSE[current-1];let saved=localStorage.getItem('pmPractice'+d.day)||'';$('#content').innerHTML=`<div class="topbar"><span class="pill">WEEK ${Math.ceil(d.day/7)} · DAY ${d.day}</span><button class="btn secondary" onclick="markDone(${d.day})">${done[d.day]?'✓ Completed':'Mark complete'}</button></div><section class="hero"><div class="crumb">LEARN → WATCH ME → YOUR CAPSTONE → CHECK</div><h1 class="vi">${esc(d.vi)}</h1><h1 class="en">${esc(d.en)}</h1><p class="vi">Mỗi ngày học một năng lực PM, xem BookNest làm mẫu, rồi áp dụng vào hệ thống bạn đang xây.</p><p class="en">Learn one PM capability, inspect a BookNest worked example, then apply the method to your own capstone.</p></section><section class="card"><h2>1. Lý thuyết · Theory</h2><p class="muted">Hiểu khái niệm trước khi tạo tài liệu.</p><div class="concepts">${d.concepts.map((x,i)=>`<div class="concept"><b>${i+1}. ${esc(x)}</b><div class="muted">Hãy tự trả lời: nó là gì, dùng khi nào, đầu vào là gì, đầu ra là gì?</div></div>`).join('')}</div></section><section class="card example"><h2>2. WATCH ME — BookNest</h2><p>${esc(d.example)}</p><div class="flow"><div>Context</div><div>Decision</div><div>Plan</div><div>Evidence</div><div>Expected Result</div></div><p class="muted">Đừng copy domain BookNest. Hãy quan sát <b>cách suy luận và cấu trúc tài liệu</b>.</p></section><section class="card practice"><h2>3. YOUR TURN — Capstone của bạn</h2><p>${esc(d.practice)}</p><textarea id="practice" class="textarea" placeholder="Viết bài làm của bạn ở đây..."></textarea><div class="actions"><button class="btn" onclick="checkPractice(${d.day})">Kiểm tra cấu trúc</button><button class="btn secondary" onclick="savePractice(${d.day})">Lưu bài</button></div><div id="practiceScore" class="score" style="display:none"></div></section><section class="card"><h2>4. Mini Quiz</h2><div id="quiz">${d.quiz.map((q,qi)=>`<div class="quizq"><b>${qi+1}. ${esc(q.q)}</b>${q.options.map((o,oi)=>`<label id="q${qi}o${oi}"><input type="radio" name="q${qi}" value="${oi}"> ${esc(o)}</label>`).join('')}<div id="ex${qi}" class="muted"></div></div>`).join('')}</div><div class="actions"><button class="btn" onclick="submitQuiz()">Nộp quiz · Submit</button></div><div id="quizScore" class="score" style="display:none"></div></section><div class="foot">Nguồn nền: PMI PMBOK® Guide 8, PMI standards, Scrum Guide. Nội dung được diễn giải thành bài học thực hành.</div>`;$('#practice').value=saved}
function savePractice(day){localStorage.setItem('pmPractice'+day,$('#practice').value);let s=$('#practiceScore');s.style.display='block';s.textContent='Đã lưu bài trên trình duyệt.'}
function checkPractice(day){let t=$('#practice').value.trim();let checks=[t.length>=120,/\d/.test(t),/(mục tiêu|objective|scope|risk|stakeholder|milestone|deliverable|owner|accept|plan|impact|metric|deadline|schedule|quality|change|uat|release)/i.test(t)];let n=checks.filter(Boolean).length;let s=$('#practiceScore');s.style.display='block';s.innerHTML=`Auto-check: <b>${n}/3</b>. ${checks[0]?'✓ Đủ độ chi tiết':'✗ Cần mô tả chi tiết hơn'} · ${checks[1]?'✓ Có dữ liệu/metric':'✗ Nên có số liệu, target hoặc mốc'} · ${checks[2]?'✓ Có thuật ngữ/cấu trúc PM':'✗ Cần thể hiện rõ artifact/decision PM'}.<br><span class="muted">Checker chỉ kiểm tra dấu hiệu cấu trúc. Chất lượng thật cần đối chiếu rubric và logic capstone.</span>`;savePractice(day)}
function submitQuiz(){let d=COURSE[current-1],score=0;d.quiz.forEach((q,qi)=>{let sel=document.querySelector(`input[name=q${qi}]:checked`);q.options.forEach((_,oi)=>document.getElementById(`q${qi}o${oi}`).classList.remove('correct','wrong'));document.getElementById(`q${qi}o${q.answer}`).classList.add('correct');if(sel){let v=+sel.value;if(v===q.answer)score++;else document.getElementById(`q${qi}o${v}`).classList.add('wrong')}document.getElementById('ex'+qi).textContent='Giải thích: '+q.explain});let s=$('#quizScore');s.style.display='block';s.innerHTML=`Điểm: <b>${score}/${d.quiz.length}</b> · ${Math.round(score/d.quiz.length*100)}%`}
function markDone(day){done[day]=!done[day];localStorage.pmDone=JSON.stringify(done);render()}document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;localStorage.pmLang=mode;render()});render();</script></body></html>
