# Include inside nginx's http {} context. Nginx terminates HTTPS directly.
server {
    listen 80;
    server_name sdh.vlu.edu.vn;
    return 308 https://sdh.vlu.edu.vn$request_uri;
}
server {
    listen 443 ssl;
    server_name sdh.vlu.edu.vn;
    ssl_certificate /etc/nginx/tls/sdh.vlu.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/sdh.vlu.edu.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace untrusted client headers; Fastify trusts only 127.0.0.1 / ::1.
    # Keep FE/BE ports private. Do not replace this with proxy_add_x_forwarded_for.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # CMS application is not included in this release.
    location = /cms { return 404; }
    location ^~ /cms/ { return 404; }

    location = /gateway { return 308 /gateway/; }
    # Strip /gateway/: /gateway/api/public/news -> /api/public/news.
    location ^~ /gateway/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_buffering off;
    }
    # Includes /api/consultations, /api/analytics/visit and /api/media/*.
    location / {
        # FE uses HOSTNAME=localhost and NODE_OPTIONS=--dns-result-order=ipv4first.
        proxy_pass http://127.0.0.1:3000;
        proxy_redirect https://localhost:3000/ https://sdh.vlu.edu.vn/;
        proxy_redirect http://localhost:3000/ https://sdh.vlu.edu.vn/;
        proxy_buffering off;
    }
}
