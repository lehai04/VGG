server {
    listen 80;
    server_name sdh.vlu.edu.vn saudaihoc.vlu.edu.vn;
    return 301 https://sdh.vlu.edu.vn$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name sdh.vlu.edu.vn saudaihoc.vlu.edu.vn;
    ssl_certificate /var/ssl/fullchain.pem;
    ssl_certificate_key /var/ssl/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host = saudaihoc.vlu.edu.vn) { return 301 https://sdh.vlu.edu.vn$request_uri; }
    root /var/www/sdh.vlu.edu.vn;
    include /etc/nginx/snippets/sdh-static-routes.conf;
}
