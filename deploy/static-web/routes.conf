# Include inside the HTTPS server {}. Root points to the extracted web directory.
index index.html;
absolute_redirect off;
charset utf-8;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
client_max_body_size 20m;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

location = / { return 302 /vi/; }
location ~ ^/(admissions|discover|programmes|news|resources|research|student-success|global)(/[a-z0-9-]+)*/?$ { return 302 /vi$request_uri; }
location ~ ^/(vi|en)/admissions/([a-z0-9-]+)/?$ { return 302 "/$1/admissions/#$2"; }
location ~ ^/(vi|en)/student-success/([a-z0-9-]+)/?$ { return 302 "/$1/student-success/#$2"; }
location ~ ^/(vi|en)/resources/[a-z0-9-]+/?$ { return 302 /$1/resources/; }
location ~ ^/(vi|en)/research/cum-nghien-cuu/?$ { return 302 "/$1/research/#fields"; }
location ~ ^/(vi|en)/research/doi-moi-sang-tao/?$ { return 302 "/$1/research/#goals"; }
location ~ ^/(vi|en)/research/doi-tac/?$ { return 302 "/$1/research/#strategic-partners-title"; }
location ~ ^/(vi|en)/research/([a-z0-9-]+)/?$ { return 302 "/$1/research/#$2"; }
location ~ ^/(vi|en)/global(?:/.*)?$ { return 302 "/$1/research/#strategic-partners-title"; }
location ~ ^/(vi|en)/programmes/thac-si/?$ { return 302 /$1/programmes/?degree=Th%E1%BA%A1c%20s%C4%A9; }
location ~ ^/(vi|en)/programmes/tien-si/?$ { return 302 /$1/programmes/?degree=Ti%E1%BA%BFn%20s%C4%A9; }
location ~ ^/(vi|en)/news/su-kien/?$ { return 302 /$1/news/?category=UNIVERSITY_EVENT; }
location ~ ^/(vi|en)/news/(tin-tuc|seminar-webinar|thong-cao-bao-chi|thu-vien-hinh-anh|video)/?$ { return 302 /$1/news/; }

# Native CMS/backend are separate services, not part of this static web package.
location = /cms { proxy_pass http://127.0.0.1:3001; }
location ^~ /cms/ {
    proxy_pass http://127.0.0.1:3001;
    client_max_body_size 101m;
    proxy_read_timeout 120s;
    proxy_buffering off;
    access_log off;
}
location = /gateway { return 308 /gateway/; }
location = /gateway/health { proxy_pass http://127.0.0.1:4000/health; }
location ^~ /gateway/api/public/ { proxy_pass http://127.0.0.1:4000/api/public/; }
location ^~ /gateway/ { return 404; }
location = /api/consultations {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:4000/api/public/consultations;
}
location = /api/analytics/visit {
    client_max_body_size 16k;
    access_log off;
    proxy_pass http://127.0.0.1:4000/api/public/visits;
}
location ^~ /api/public/ { proxy_pass http://127.0.0.1:4000; }
location ^~ /api/media/ { proxy_pass http://127.0.0.1:4000/api/public/media/; }
location /api/ { return 404; }

location ~* ^/documents/.*\.pdf$ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self'; base-uri 'none'" always;
    try_files $uri =404;
}
location / { try_files $uri $uri.html $uri/ =404; }
error_page 404 /404.html;
location = /404.html { internal; }
