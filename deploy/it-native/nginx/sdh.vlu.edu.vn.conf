# Include inside nginx http {}. Certificate paths match the files supplied by IT.
server {
    listen 80;
    server_name saudaihoc.vlu.edu.vn sdh.vlu.edu.vn;
    return 301 https://sdh.vlu.edu.vn$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name saudaihoc.vlu.edu.vn sdh.vlu.edu.vn;
    ssl_certificate /var/ssl/fullchain.pem;
    ssl_certificate_key /var/ssl/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 20m;
    # Canonical origin is also the origin accepted by CMS CSRF checks.
    if ($host = saudaihoc.vlu.edu.vn) { return 301 https://sdh.vlu.edu.vn$request_uri; }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;

    location = /cms { proxy_pass http://127.0.0.1:3001; }
    location ^~ /cms/ {
        # Preserve /cms: it is compiled into the Next.js build.
        proxy_pass http://127.0.0.1:3001;
        client_max_body_size 101m;
        client_body_timeout 120s;
        proxy_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        access_log off;
    }
    location = /gateway { return 308 /gateway/; }
    location = /gateway/health { proxy_pass http://127.0.0.1:4000/health; }
    location ^~ /gateway/api/public/ {
        # /gateway/api/public/news -> backend /api/public/news
        proxy_pass http://127.0.0.1:4000/api/public/;
    }
    # Admin traffic must pass through CMS's session/CSRF proxy.
    location ^~ /gateway/ { return 404; }
    location = /api/admin { return 404; }
    location ^~ /api/admin/ { return 404; }
    # Preserve IT's existing public API URL for compatibility.
    location ^~ /api/public/ { proxy_pass http://127.0.0.1:4000; }
    location / { proxy_pass http://localhost:3000; }
}
